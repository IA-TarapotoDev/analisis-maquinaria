<title>Acceso restringido</title>
<script>try { var t = localStorage.getItem('envios.tema'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* sin almacenamiento */ }</script>
<style>
  :root { color-scheme: light; --fondo: #e4ebe8; --sup: #ffffff; --texto: #13211f; --suave: #55645f; --borde: #e2e8e5; --boton: #12302e; --boton-txt: #e9f2ef; --rojo: #c53030; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) { color-scheme: dark; --fondo: #050908; --sup: #18211f; --texto: #e6eeeb; --suave: #a7b6b1; --borde: #26322f; --boton: #2bb8a9; --boton-txt: #04110f; --rojo: #f07a7a; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --fondo: #050908; --sup: #18211f; --texto: #e6eeeb; --suave: #a7b6b1; --borde: #26322f; --boton: #2bb8a9; --boton-txt: #04110f; --rojo: #f07a7a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; background: var(--fondo); color: var(--texto);
    font: 15px/1.45 Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .tarjeta { width: 100%; max-width: 420px; background: var(--sup); border: 1px solid var(--borde); border-radius: 18px; padding: 24px; }
  h1 { margin: 0 0 6px; font-size: 20px; }
  p { margin: 0 0 16px; color: var(--suave); font-size: 14px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  input { width: 100%; font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--borde); background: var(--fondo); color: var(--texto); }
  button { margin-top: 14px; font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 10px; border: 0; background: var(--boton); color: var(--boton-txt); cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--boton); outline-offset: 2px; }
  .error { color: var(--rojo); font-size: 13px; min-height: 1.2em; margin: 8px 0 0; }
</style>
</head>
<body>
<main>
  <form class="tarjeta" id="form" autocomplete="off">
    <h1>Acceso restringido</h1>

    <label for="clave">Clave de acceso</label>
    <input id="clave" type="password" required autocomplete="off" spellcheck="false">
    <p class="error" id="error" role="alert"></p>
    <button type="submit" id="abrir">Abrir</button>
  </form>
</main>

<script>
(() => {
  'use strict';
  const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function descifrar(clave) {
    const p = JSON.parse(document.getElementById('cifrado').textContent);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
    const llave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(p.s), iterations: p.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(p.i) }, llave, b(p.c));
    const flujo = new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(flujo).text();
  }
  const form = document.getElementById('form'), err = document.getElementById('error'), btn = document.getElementById('abrir');
  if (!(window.crypto && crypto.subtle && window.DecompressionStream)) {
    err.textContent = 'Este navegador no puede abrir la página. Use Edge o Chrome actualizados.';
    btn.disabled = true;
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    err.textContent = 'Abriendo…';
    let html;
    try {
      html = await descifrar(document.getElementById('clave').value);
    } catch (_) {
      err.textContent = 'Clave incorrecta.';
      btn.disabled = false;
      return;
    }
    document.getElementById('clave').value = '';
    document.open();
    document.write(html);
    document.close();
  });
})();
</script>
